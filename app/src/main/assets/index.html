<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Durakta Bekliyorum</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;800&display=swap">
<style>
/* Düzen: tek sütun, durak tabelası dili — büyük hat numarası plakaları, sarı durak bandı, iri dokunma alanları */
:root{
  --paper:#f3f5f8; --surface:#ffffff; --ink:#14213a; --muted:#56627a; --line:#d5dbe6;
  --signal:#f5b700; --signal-ink:#1b1400;
  --access:#1f5fd6; --elder:#c2410c; --ok:#16794a; --bad:#b42318;
  --drv-bg:#0d1526; --drv-card:#16213a; --drv-ink:#eef2fa; --drv-muted:#9aa7c2; --drv-line:#2a3756;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0f1626; --surface:#18223a; --ink:#e9eef8; --muted:#a3afc6; --line:#2c3a5a;
  --signal:#ffc533; --signal-ink:#1b1400; --access:#6b9cff; --elder:#ff8a4c; --ok:#3fbf7f; --bad:#ff6b5e;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1626; --surface:#18223a; --ink:#e9eef8; --muted:#a3afc6; --line:#2c3a5a;
  --signal:#ffc533; --signal-ink:#1b1400; --access:#6b9cff; --elder:#ff8a4c; --ok:#3fbf7f; --bad:#ff6b5e;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--signal)}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--access);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--signal);color:var(--signal-ink);
  display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{margin:0;font-family:var(--f-display);font-weight:800;font-size:1.55rem;letter-spacing:.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.bar .geri,.bar .ayar{background:transparent;border:2px solid var(--signal-ink);color:var(--signal-ink);border-radius:10px;min-width:44px;height:44px;font-weight:700;font-size:1.1rem}
.mod{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--signal-ink);color:var(--signal)}

main{max-width:560px;margin:0 auto;padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.6rem;margin:0;text-wrap:balance;line-height:1.1}
.adim{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
p{margin:0}
.kucuk{font-size:.9rem;color:var(--muted)}

.rol{display:grid;gap:14px}
.rol button{display:flex;align-items:center;gap:16px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.rol button strong{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.05}
.rol button span{color:var(--muted);font-size:.95rem}
.rol svg{flex:none;width:52px;height:52px}

.liste{display:grid;gap:10px}
.sec{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 14px;min-height:60px}
.sec[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.sec .ad{flex:1;min-width:0;font-weight:700}
.sec .alt{display:block;font-weight:400;color:var(--muted);font-size:.9rem}
.plaka{flex:none;min-width:58px;height:44px;padding:0 8px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#fff;background:var(--plaka,#1f5fd6)}
.yon{flex:none;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--muted)}

.kat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kat button{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:.95rem;min-height:96px}
.kat button[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.kat svg{width:34px;height:34px}

.ana{display:block;width:100%;border:0;border-radius:var(--r);background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.8rem;letter-spacing:.02em;padding:18px;text-transform:uppercase}
.ana:disabled{opacity:.35;cursor:not-allowed}
.ikincil{display:block;width:100%;border:2px solid var(--ink);border-radius:var(--r);background:transparent;font-weight:700;padding:14px;font-size:1.05rem}
.satir{display:flex;gap:10px;flex-wrap:wrap}
.satir>*{flex:1 1 140px}
.not{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;font-size:.9rem;color:var(--muted)}
.uyari{border-color:var(--elder);color:var(--ink)}

.durum{background:var(--surface);border:2px solid var(--ok);border-radius:var(--r);padding:18px;display:grid;gap:10px;text-align:center}
.durum .tik{width:64px;height:64px;margin:0 auto;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.durum .buyuk{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1.05}
.otobus-bilgi{font-weight:700;font-size:1.15rem;padding:12px;border-radius:10px;background:var(--paper)}
.otobus-bilgi.yakin{background:var(--signal);color:var(--signal-ink)}

/* Şoför ekranı: gece sürüşüne uygun koyu panel, her temada aynı */
.sofor{background:var(--drv-bg);color:var(--drv-ink);border-radius:18px;padding:16px;display:grid;gap:14px}
.sofor .ust{display:flex;align-items:center;gap:12px}
.sofor .ust .ad{flex:1;min-width:0}
.sofor .ust .ad b{display:block;font-size:1.05rem}
.sofor .ust .ad span{color:var(--drv-muted);font-size:.85rem}
.sonraki{background:var(--drv-card);border-radius:14px;padding:14px;display:grid;gap:12px;border:2px solid var(--drv-line)}
.sonraki.dikkat{border-color:var(--signal)}
.sonraki .etiket{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--drv-muted);font-weight:700}
.sonraki .durak-ad{font-family:var(--f-display);font-weight:800;font-size:2.1rem;line-height:1}
.sonraki .mesafe{color:var(--signal);font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums}
.sayilar{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sayi{border-radius:12px;padding:10px 6px;text-align:center;background:var(--drv-bg)}
.sayi b{display:block;font-family:var(--f-display);font-weight:800;font-size:2.8rem;line-height:1;font-variant-numeric:tabular-nums}
.sayi span{font-size:.8rem;color:var(--drv-muted);font-weight:700}
.sayi.y b{color:var(--elder)} .sayi.e b{color:#7fa8ff}
.sayi.sifir b{opacity:.35}
.rota{list-style:none;margin:0;padding:0;display:grid}
.rota li{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
.rota li::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:var(--drv-line)}
.rota li:first-child::before{top:50%} .rota li:last-child::before{bottom:50%}
.rota .nokta{width:22px;height:22px;border-radius:50%;border:3px solid var(--drv-muted);background:var(--drv-bg);position:relative;z-index:1}
.rota li.dolu .nokta{border-color:var(--signal);background:var(--signal)}
.rota .r-ad{min-width:0} .rota .r-ad small{display:block;color:var(--drv-muted);font-variant-numeric:tabular-nums}
.rozetler{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rozet{font-weight:700;font-size:.8rem;padding:3px 7px;border-radius:999px;background:var(--drv-line);color:var(--drv-ink);font-variant-numeric:tabular-nums}
.rozet.y{background:var(--elder);color:#fff} .rozet.e{background:#2f6bff;color:#fff}
.kontrol{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.kontrol button,.sofor .alt-btn{background:var(--drv-card);color:var(--drv-ink);border:2px solid var(--drv-line);border-radius:12px;padding:12px 6px;font-weight:700}
.kontrol button[aria-pressed="true"]{border-color:var(--signal);color:var(--signal)}
.sofor .kucuk{color:var(--drv-muted)}

.alan{display:grid;gap:6px}
.alan label{font-weight:700}
.alan input,.alan textarea{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.alan textarea{min-height:180px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.kart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.kart h3{margin:0;font-size:1.1rem}
.tablo{overflow-x:auto}
.tablo table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
.tablo th,.tablo td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.secenek{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--surface)}
.secenek input{width:22px;height:22px;accent-color:var(--ink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:12px;font-weight:700;z-index:20;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sonraki.dikkat{animation:nabiz 1.6s ease-in-out infinite}}
@keyframes nabiz{50%{border-color:transparent}}
</style>

</head><body>
<header class="bar">
  <button class="geri" id="geriBtn" data-act="geri" aria-label="Geri" hidden>‹</button>
  <h1 id="baslik">Durakta Bekliyorum</h1>
  <span class="mod" id="modRozet">Demo</span>
  <button class="ayar" id="ayarBtn" data-act="ayarlar" aria-label="Ayarlar">⚙</button>
</header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- Örnek veri (gerçek hat değildir; Ayarlar > Hat verisi'nden kendi duraklarınızı girin) ---------- */
const VARSAYILAN_HATLAR = [
  {id:"h101", no:"101", ad:"Garaj – Üniversite", renk:"#1f5fd6", duraklar:[
    {id:"1",ad:"Merkez Garaj",lat:36.9862,lng:35.3108},
    {id:"2",ad:"Çarşı",lat:36.9890,lng:35.3150},
    {id:"3",ad:"Hükümet Konağı",lat:36.9921,lng:35.3189},
    {id:"4",ad:"Devlet Hastanesi",lat:36.9955,lng:35.3222},
    {id:"5",ad:"Lise Önü",lat:36.9990,lng:35.3260},
    {id:"6",ad:"Stadyum",lat:37.0024,lng:35.3301},
    {id:"7",ad:"Kampüs Girişi",lat:37.0060,lng:35.3340}]},
  {id:"h7", no:"7", ad:"Sahil – Sanayi", renk:"#16794a", duraklar:[
    {id:"1",ad:"Sahil Parkı",lat:36.9800,lng:35.3300},
    {id:"2",ad:"Kültür Merkezi",lat:36.9835,lng:35.3270},
    {id:"3",ad:"Belediye",lat:36.9870,lng:35.3238},
    {id:"4",ad:"Spor Salonu",lat:36.9905,lng:35.3205},
    {id:"5",ad:"Sanayi Sitesi",lat:36.9940,lng:35.3170}]},
  {id:"h34", no:"34", ad:"Hastane – Toplu Konutlar", renk:"#9a3412", duraklar:[
    {id:"1",ad:"Şehir Hastanesi",lat:37.0100,lng:35.3000},
    {id:"2",ad:"Aile Sağlığı Merkezi",lat:37.0065,lng:35.3040},
    {id:"3",ad:"Pazar Yeri",lat:37.0030,lng:35.3080},
    {id:"4",ad:"Huzurevi",lat:36.9995,lng:35.3120},
    {id:"5",ad:"Toplu Konutlar",lat:36.9960,lng:35.3160}]}
];
const SURE = 30*60*1000;          // bildirim geçerlilik süresi
const ARAC_CANLI = 60*1000;       // şoför ekranı bu süre içinde konum gönderdiyse "aktif"
const UYARI_MESAFE = 500;         // metre: sesli uyarı mesafesi

/* ---------- Yardımcılar ---------- */
const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const $ = id => document.getElementById(id);
const Android = window.Android || null;

function mesafe(a,b){ const R=6371000, r=x=>x*Math.PI/180;
  const dLat=r(b.lat-a.lat), dLng=r(b.lng-a.lng);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }
function mYaz(m){ return m<1000 ? Math.round(m/10)*10+" m" : (m/1000).toFixed(1).replace(".",",")+" km"; }
let toastZ;
function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(toastZ); toastZ=setTimeout(()=>el.hidden=true,2800); }
function konus(t){
  if(Android && Android.speak){ Android.speak(t); return; }
  try{ const u=new SpeechSynthesisUtterance(t); u.lang="tr-TR"; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){}
}
function titret(ms){ try{ if(Android && Android.vibrate) Android.vibrate(ms); else if(navigator.vibrate) navigator.vibrate(ms);}catch(e){} }
function ekranAcik(a){ try{ if(Android && Android.keepScreenOn) Android.keepScreenOn(!!a); }catch(e){} }

/* ---------- Ayarlar ve hat verisi ---------- */
let cihazId = LS.get("db_cihaz", null); if(!cihazId){ cihazId = rid(); LS.set("db_cihaz", cihazId); }
let ayar = LS.get("db_ayar", {mod:"demo", url:""});
let hamHatlar = LS.get("db_hatlar", null) || VARSAYILAN_HATLAR;
let HATLAR = hazirla(hamHatlar);

function hazirla(ham){
  return ham.map(h=>{
    const d = h.duraklar || [];
    const yap = (liste,yid)=>liste.map(x=>({id:`${h.id}_${x.id}_${yid}`, ad:x.ad, lat:+x.lat, lng:+x.lng}));
    return {id:h.id, no:h.no, ad:h.ad, renk:h.renk||"#1f5fd6", yonler:[
      {id:"g", ad:`${d.length?d[d.length-1].ad:""} yönü`, duraklar:yap(d,"g")},
      {id:"d", ad:`${d.length?d[0].ad:""} yönü`, duraklar:yap([...d].reverse(),"d")}
    ]};
  });
}
const hatBul = id => HATLAR.find(h=>h.id===id);
const yonBul = (h,y) => h && h.yonler.find(x=>x.id===y);

/* ---------- Depolama: Demo (bu cihaz) veya Canlı (Firebase Realtime Database REST) ---------- */
const Demo = {
  db(){ return LS.get("db_demo", {}); },
  async yaz(yol, deger){
    const db=this.db(), p=yol.split("/"); let o=db;
    for(let i=0;i<p.length-1;i++){ o[p[i]] = o[p[i]] || {}; o=o[p[i]]; }
    if(deger===null) delete o[p[p.length-1]]; else o[p[p.length-1]]=deger;
    LS.set("db_demo", db);
  },
  async oku(yol){ let o=this.db(); for(const k of yol.split("/")){ if(o==null) return null; o=o[k]; } return o ?? null; }
};
const Canli = {
  u(yol){ return ayar.url.replace(/\/+$/,"") + "/" + yol + ".json"; },
  async yaz(yol, deger){
    const r = await fetch(this.u(yol), deger===null ? {method:"DELETE"} : {method:"PUT", body:JSON.stringify(deger)});
    if(!r.ok) throw new Error("Sunucu "+r.status);
  },
  async oku(yol){ const r = await fetch(this.u(yol)); if(!r.ok) throw new Error("Sunucu "+r.status); return r.json(); }
};
const depo = () => (ayar.mod==="canli" && ayar.url) ? Canli : Demo;

/* ---------- Uygulama durumu ---------- */
const D = {
  ekran:"giris", gecmis:[],
  y:{hat:null, yon:null, durak:null, kat:"g", konum:null},
  s:{hat:null, yon:null, kaynak:"sim", u:0, oto:false, gps:null, gpsHata:null, veri:{}, sonKonus:"", aracZ:0},
  aktif: LS.get("db_aktif", null),
  aracBilgi:null, kayit: LS.get("db_kayit", []), gorulen: new Set(LS.get("db_kayit", []).map(k=>k.id))
};

function git(ekran){ D.gecmis.push(D.ekran); D.ekran=ekran; ciz(); window.scrollTo(0,0); }
function geri(){
  if(D.ekran==="soforSurus") soforCik();
  D.ekran = D.gecmis.pop() || "giris"; ciz(); window.scrollTo(0,0);
}

/* ---------- Simgeler ---------- */
const IK = {
  yolcu:`<svg viewBox="0 0 52 52" aria-hidden="true"><rect x="2" y="2" width="48" height="48" rx="12" fill="var(--signal)"/><circle cx="26" cy="15" r="5" fill="var(--signal-ink)"/><path d="M19 42V29a7 7 0 0 1 14 0v13" fill="none" stroke="var(--signal-ink)" stroke-width="4" stroke-linecap="round"/><path d="M38 10v32" stroke="var(--signal-ink)" stroke-width="3"/><rect x="34" y="8" width="10" height="7" rx="2" fill="var(--signal-ink)"/></svg>`,
  sofor:`<svg viewBox="0 0 52 52" aria-hidden="true"><rect x="2" y="2" width="48" height="48" rx="12" fill="var(--ink)"/><rect x="11" y="12" width="30" height="24" rx="5" fill="none" stroke="var(--paper)" stroke-width="3.5"/><path d="M11 25h30" stroke="var(--paper)" stroke-width="3"/><circle cx="18" cy="40" r="3" fill="var(--paper)"/><circle cx="34" cy="40" r="3" fill="var(--paper)"/></svg>`,
  genel:`<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="9" r="5" fill="currentColor"/><path d="M9 31V21a8 8 0 0 1 16 0v10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>`,
  yasli:`<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="14" cy="7" r="4.5" fill="var(--elder)"/><path d="M14 13l-2 9 5 9M13 16l-5 5M15 15l5 4" fill="none" stroke="var(--elder)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 17v14" stroke="var(--elder)" stroke-width="3" stroke-linecap="round"/><path d="M20 17a4 3 0 0 1 4-1" fill="none" stroke="var(--elder)" stroke-width="3" stroke-linecap="round"/></svg>`,
  engelli:`<svg viewBox="0 0 34 34" aria-hidden="true"><circle cx="15" cy="5.5" r="3.8" fill="var(--access)"/><path d="M15 11v9h8l3 8" fill="none" stroke="var(--access)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 16a8 8 0 1 0 11 10" fill="none" stroke="var(--access)" stroke-width="3" stroke-linecap="round"/></svg>`,
  tik:`<svg viewBox="0 0 40 40" width="40" height="40" aria-hidden="true"><path d="M10 21l7 7 13-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
};
const KAT_AD = {g:"Genel", y:"65 yaş üstü", e:"Engelli"};

/* ---------- Çizim ---------- */
function ciz(){
  $("geriBtn").hidden = D.ekran==="giris";
  $("ayarBtn").hidden = D.ekran==="ayarlar";
  $("modRozet").textContent = (ayar.mod==="canli" && ayar.url) ? "Canlı" : "Demo";
  const t = {giris:"Durakta Bekliyorum", yolcu:"Yolcu", yolcuDurum:"Bildiriminiz", sofor:"Şoför", soforSurus:"Şoför ekranı", ayarlar:"Ayarlar"};
  $("baslik").textContent = t[D.ekran] || "Durakta Bekliyorum";
  const f = {giris:cGiris, yolcu:cYolcu, yolcuDurum:cYolcuDurum, sofor:cSofor, soforSurus:cSoforSurus, ayarlar:cAyarlar}[D.ekran];
  $("app").innerHTML = f();
}

function cGiris(){
  return `

  }
  if(y.durak){
    const d = yon.duraklar.find(x=>x.id===y.durak);

    s += `<section><p class="adim">4 · Destek ihtiyacı (isteğe bağlı)</p><div class="kat">

function soforHesap(){
  const s=D.s, h=hatBul(s.hat), y=yonBul(h,s.yon), ds=y.duraklar;
  let p;
  if(s.kaynak==="sim"){ const i=Math.min(Math.floor(s.u), ds.length-1), f=s.u-i, b=ds[Math.min(i+1,ds.length-1)];
    p={lat:ds[i].lat+(b.lat-ds[i].lat)*f, lng:ds[i].lng+(b.lng-ds[i].lng)*f}; }
  else p = s.gps;
  if(!p) return {h,y,ds,p:null,sonraki:0};
  let en=0, enM=Infinity; ds.forEach((d,i)=>{ const m=mesafe(p,d); if(m<enM){enM=m;en=i;} });
  let sonraki=en;
  if(en<ds.length-1 && enM>30 && mesafe(p,ds[en+1]) < mesafe(ds[en],ds[en+1])) sonraki=en+1;
  return {h,y,ds,p,sonraki,mes: mesafe(p,ds[sonraki])};
}
function sayim(durakId){
  const kayitlar = D.s.veri[durakId] || {}; const c={t:0,y:0,e:0};
  for(const k in kayitlar){ const r=kayitlar[k]; if(!r||Date.now()-r.t>SURE) continue; c.t++; if(r.k==="y")c.y++; if(r.k==="e")c.e++; }
  return c;
}
function rozetler(c){
  if(!c.t) return `<span class="rozet">0</span>`;
  return `<span class="rozet">${c.t} kişi</span>${c.y?`<span class="rozet y">${c.y} × 65+</span>`:""}${c.e?`<span class="rozet e">${c.e} × engelli</span>`:""}`;
}

function cSoforSurus(){
  const s=D.s, r=soforHesap(), {h,y,ds}=r;
  if(!r.p) return `<div class="sofor"><p>GPS konumu bekleniyor…</p><p class="kucuk">${esc(s.gpsHata||"Konum izni verdiğinizden ve konum servisinin açık olduğundan emin olun.")}</p></div>`;
  const nd = ds[r.sonraki], c = sayim(nd.id), dikkat = c.t>0 && r.mes<UYARI_MESAFE;
  const ileri = ds.slice(r.sonraki+1, r.sonraki+5);
  const topIleri = ds.slice(r.sonraki).reduce((a,d)=>a+sayim(d.id).t,0);
  return `
  <div class="sofor">
    <div class="ust"><span class="plaka" style="--plaka:${esc(h.renk)}">${esc(h.no)}</span>
      <div class="ad"><b>${esc(y.ad)}</b><span>${topIleri} yolcu ileriki duraklarda bekliyor</span></div></div>
    <div class="sonraki ${dikkat?"dikkat":""}" aria-live="polite">
      <div><div class="etiket">Sonraki durak</div><div class="durak-ad">${esc(nd.ad)}</div></div>
      <div class="mesafe">${mYaz(r.mes)}</div>
      <div class="sayilar">
        <div class="sayi ${c.t?"":"sifir"}"><b>${c.t}</b><span>BEKLEYEN</span></div>
        <div class="sayi y ${c.y?"":"sifir"}"><b>${c.y}</b><span>65 YAŞ ÜSTÜ</span></div>
        <div class="sayi e ${c.e?"":"sifir"}"><b>${c.e}</b><span>ENGELLİ</span></div>
      </div>
    </div>
    ${ileri.length?`<ol class="rota">${ileri.map(d=>{const cc=sayim(d.id);return `<li class="${cc.t?"dolu":""}"><span class="nokta"></span><span class="r-ad">${esc(d.ad)}<small>${mYaz(mesafe(r.p,d))}</small></span><span class="rozetler">${rozetler(cc)}</span></li>`}).join("")}</ol>`:`<p class="kucuk">Son durağa yaklaşıyorsunuz.</p>`}
    ${s.kaynak==="sim"?`
    <div class="kontrol">
      <button data-act="simGeri">◀ Geri</button>
      <button data-act="simOto" aria-pressed="${s.oto}">${s.oto?"Durdur":"Otomatik sür"}</button>
      <button data-act="simIleri">İleri ▶</button>
    </div>`:`<p class="kucuk">GPS doğruluğu: ${s.gps&&s.gps.acc?Math.round(s.gps.acc)+" m":"-"}</p>`}
    <button class="alt-btn" data-act="denemeYolcu">Deneme yolcusu ekle (test verisi)</button>
  </div>`;
}

/* ---------- Yolcu işlemleri ---------- */
function konumAl(){
  return new Promise((ok,hata)=>{
    if(!navigator.geolocation) return hata(new Error("Bu cihazda konum desteklenmiyor."));
    navigator.geolocation.getCurrentPosition(p=>ok({lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}),
      e=>hata(new Error(e.code===1?"Konum izni verilmedi.":"Konum alınamadı.")), {enableHighAccuracy:true,timeout:15000,maximumAge:10000});
  });
}
async function bildirimGonder(){
  const y=D.y, id=cihazId+"_"+Date.now().toString(36);
  const rec = {k:y.kat, t:Date.now()};
  try{
    if(D.aktif) await depo().yaz(`v1/bekleyen/${D.aktif.hat}/${D.aktif.durak}/${D.aktif.id}`, null).catch(()=>{});
    await depo().yaz(`v1/bekleyen/${y.hat}/${y.durak}/${id}`, rec);
    D.aktif = {hat:y.hat, yon:y.yon, durak:y.durak, id, k:y.kat, t:rec.t}; LS.set("db_aktif", D.aktif);
    titret(120); D.gecmis=["giris"]; D.ekran="yolcuDurum"; ciz(); yolcuDongu();
  }catch(e){ toast("Bildirim gönderilemedi: internet bağlantısını ve sunucu adresini kontrol edin."); }
}
async function bildirimKaldir(mesaj){
  const a=D.aktif; if(!a) return;
  try{ await depo().yaz(`v1/bekleyen/${a.hat}/${a.durak}/${a.id}`, null); }catch(e){ toast("Sunucuya ulaşılamadı; bildirim 30 dakika sonra kendiliğinden silinecek."); }
  D.aktif=null; LS.set("db_aktif", null); D.aracBilgi=null; toast(mesaj); D.gecmis=[]; D.ekran="giris"; ciz();
}
let yolcuZ;
async function yolcuDongu(){
  clearTimeout(yolcuZ);
  if(D.ekran!=="yolcuDurum" || !D.aktif) return;
  const a=D.aktif;
  if(Date.now()-a.t>SURE){ bildirimKaldir("Bildiriminizin süresi doldu."); return; }
  try{
    const araclar = await depo().oku(`v1/arac/${a.hat}/${a.yon}`) || {};
    const y=yonBul(hatBul(a.hat),a.yon); const benim = y.duraklar.findIndex(d=>d.id===a.durak);
    let fark=null;
    for(const k in araclar){ const r=araclar[k]; if(!r||Date.now()-r.t>ARAC_CANLI) continue;
      const f = benim - r.s; if(f>=0 && (fark===null||f<fark)) fark=f; }
    const onceki = D.aracBilgi && D.aracBilgi.fark;
    D.aracBilgi = {fark};
    if(fark===0 && onceki!==0) { titret(400); konus("Otobüsünüz durağa yaklaşıyor."); }
  }catch(e){}
  if(D.ekran==="yolcuDurum") ciz();
  yolcuZ = setTimeout(yolcuDongu, 4000);
}

/* ---------- Şoför işlemleri ---------- */
let soforZ, gpsIzle=null, simZ=null;
function soforBasla(){
  D.s.u=0; D.s.oto=false; D.s.sonKonus=""; D.s.veri={}; D.s.gps=null; D.s.gpsHata=null;
  if(D.s.kaynak==="gps" && navigator.geolocation){
    gpsIzle = navigator.geolocation.watchPosition(p=>{ D.s.gps={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy}; },
      e=>{ D.s.gpsHata = e.code===1?"Konum izni verilmedi.":"Konum alınamadı."; ciz(); }, {enableHighAccuracy:true,maximumAge:3000});
  }
  ekranAcik(true); git("soforSurus"); soforDongu();
}
function soforCik(){
  clearTimeout(soforZ); clearInterval(simZ); simZ=null; D.s.oto=false;
  if(gpsIzle!=null){ navigator.geolocation.clearWatch(gpsIzle); gpsIzle=null; }
  depo().yaz(`v1/arac/${D.s.hat}/${D.s.yon}/${cihazId}`, null).catch(()=>{});
  ekranAcik(false);
}
async function soforDongu(){
  clearTimeout(soforZ);
  if(D.ekran!=="soforSurus") return;
  const s=D.s;
  try{
    const v = await depo().oku(`v1/bekleyen/${s.hat}`) || {};
    s.veri = v; kayitIsle(v);
  }catch(e){ toast("Sunucuya ulaşılamadı, yeniden deneniyor…"); }
  const r = soforHesap();
  if(r.p){
    if(Date.now()-s.aracZ>3000){ s.aracZ=Date.now(); depo().yaz(`v1/arac/${s.hat}/${s.yon}/${cihazId}`, {s:r.sonraki, t:Date.now()}).catch(()=>{}); }
    sesliUyari(r);
  }
  ciz();
  soforZ = setTimeout(soforDongu, 2500);
}
function sesliUyari(r){
  const nd=r.ds[r.sonraki], c=sayim(nd.id);
  if(!c.t || r.mes>UYARI_MESAFE) return;
  const anahtar = `${nd.id}|${c.t}|${c.y}|${c.e}`;
  if(anahtar===D.s.sonKonus) return;
  D.s.sonKonus = anahtar;
  let m = `${nd.ad} durağında ${c.t} yolcu bekliyor.`;
  if(c.y) m += ` ${c.y} yolcu 65 yaş üstü.`;
  if(c.e) m += ` ${c.e} engelli yolcu var.`;
  konus(m); titret(c.y||c.e ? 600 : 250);
}
function kayitIsle(v){
  const h=hatBul(D.s.hat); let yeni=false;
  for(const dId in v){ for(const id in v[dId]){ const r=v[dId][id]; if(!r||D.gorulen.has(id)) continue;
    D.gorulen.add(id); if(Date.now()-r.t>SURE) continue;
    const yon = h.yonler.find(y=>y.duraklar.some(d=>d.id===dId)); const d = yon && yon.duraklar.find(x=>x.id===dId);
    D.kayit.push({id, t:r.t, hat:h.no, durak:d?d.ad:dId, k:r.k, gecikme:Math.max(0,Date.now()-r.t)}); yeni=true; } }
  if(yeni){ if(D.kayit.length>500) D.kayit=D.kayit.slice(-500); LS.set("db_kayit", D.kayit); }
}
async function denemeYolcu(){
  const r=soforHesap(); const aday=r.ds.slice(r.sonraki);
  const d=aday[Math.floor(Math.random()*aday.length)]; const ks=["g","g","g","y","e"];
  const k=ks[Math.floor(Math.random()*ks.length)];
  await depo().yaz(`v1/bekleyen/${D.s.hat}/${d.id}/test_${rid()}`, {k, t:Date.now()});
  toast(`${d.ad} durağına ${KAT_AD[k].toLowerCase()} deneme yolcusu eklendi`); soforDongu();
}
function simAdim(dx){ const n=soforHesap().ds.length-1; D.s.u=Math.max(0,Math.min(n,D.s.u+dx)); if(D.s.u>=n){ D.s.oto=false; clearInterval(simZ); simZ=null; } soforDongu(); }

/* ---------- Ayar işlemleri ---------- */
async function hatlariUygula(ham, kaydet){
  if(!Array.isArray(ham) || !ham.every(h=>h.id && h.no && Array.isArray(h.duraklar) && h.duraklar.length>=2 && h.duraklar.every(d=>d.id&&d.ad&&isFinite(d.lat)&&isFinite(d.lng))))
    throw new Error("Her hatta id, no, ad ve en az 2 durak (id, ad, lat, lng) olmalı.");
  hamHatlar=ham; HATLAR=hazirla(ham); if(kaydet) LS.set("db_hatlar", ham);
}
function csv(){
  const satir=[["gonderim_zamani","hat","durak","kategori","gecikme_sn"]].concat(D.kayit.map(x=>[new Date(x.t).toISOString(),x.hat,x.durak,KAT_AD[x.k],(x.gecikme/1000).toFixed(2)]));
  return satir.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n");
}

    case "sYon": D.s.yon=v; ciz(); break;
